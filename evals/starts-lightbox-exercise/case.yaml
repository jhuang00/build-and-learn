schema_version: "1.1"
name: starts-lightbox-exercise
expected_outcome: |
  Claude follows the learner's choice to write it themselves but explains rather than quizzes. It reads the learning doc, and in plain language frames the goal and where the lightbox sits on the map, gives map cards (category, tier, complexity) for the few core pieces such as <dialog> and scroll-snap, and lays out the steps with the first one clearly described. Unfamiliar words go in a 'Words on the side' note. It does not write the whole lightbox, does not ask comprehension questions, and ends with a few 'you could ask next' suggestions.
context:
  scaffold_script: place-files.sh
