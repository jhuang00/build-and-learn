<!-- my lightbox practice -->
<div class="gallery">
  <img src="images/photo-1.jpg" alt="Photo 1" class="thumb" />
  <img src="images/photo-2.jpg" alt="Photo 2" class="thumb" />
  <img src="images/photo-3.jpg" alt="Photo 3" class="thumb" />
</div>

<dialog id="lightbox" class="lightbox">
  <div class="lightbox__slides">
    <img src="images/photo-1.jpg" alt="Photo 1" />
    <img src="images/photo-2.jpg" alt="Photo 2" />
    <img src="images/photo-3.jpg" alt="Photo 3" />
  </div>
  <button class="lightbox__close" aria-label="Close">×</button>
</dialog>

<style>
  .lightbox__slides { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; }
  .lightbox__slides img { flex: 0 0 100%; scroll-snap-align: center; }
</style>

<script>
  var lightbox = document.getElementById('lightbox');
  var thumbs = document.querySelectorAll('.thumb');

  thumbs.forEach(function (thumb, i) {
    thumb.addEventListener('click', function () {
      lightbox.show();
      var slides = lightbox.querySelectorAll('.lightbox__slides img');
      slides[i].scrollIntoView();
    });
  });

  lightbox.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      lightbox.close();
    }
  });

  lightbox.querySelector('.lightbox__close').addEventListener('click', function () {
    lightbox.close();
  });
</script>
